name: Deploy To EC2

on:
  workflow_run:
    workflows: ["Sanity Checks"]
    types: [completed]

jobs:
  deploy:
    name: Deploy Node.js App
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_APP_DIR }}
            git pull origin main
            sudo docker build -t e-commerce-cicd .
            sudo docker rm -f e-commerce-cicd || true
            sudo docker run -d \
              --name e-commerce-cicd \
              --restart always \
              -p 8080:8080 \
              e-commerce-cicd

            for i in 1 2 3 4 5; do
              if curl --fail --silent http://localhost:8080/health > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              sleep 3
            done

            sudo docker logs e-commerce-cicd
            exit 1
